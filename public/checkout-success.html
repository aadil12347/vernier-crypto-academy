<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seat Confirmed &amp; Unlocked — VERNIER</title>
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
  <link rel="stylesheet" href="/styles/tokens.css">
  <link rel="stylesheet" href="/styles/site.css">
</head>
<body>
  <header class="site-header" aria-label="Primary navigation">
    <a class="brand-lockup" href="/"><img src="/assets/logo.svg" alt="" width="24" height="24"><span>VERNIER</span></a>
    <nav class="nav-links"><a href="/dashboard">Dashboard</a><a href="/course" class="nav-cta">Open Course Portal</a></nav>
  </header>

  <main style="min-height:100vh;padding:96px clamp(20px,5vw,72px) 72px;display:grid;place-items:center;">
    <section class="spec-card featured" style="width:min(640px,100%);">
      <div class="spec-label"><span class="dot"></span><span id="suc-badge">WHOP SETTLEMENT // VERIFYING</span></div>
      <h1 id="suc-title" class="display-lg" style="font-size:2.1rem;margin:10px 0 8px;">Verifying Your Whop Checkout</h1>
      <p id="suc-copy" style="margin:0;color:var(--muted);">Loading order ledger record...</p>

      <dl id="suc-meta" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin:22px 0;padding:16px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);"></dl>

      <div style="display:flex;flex-wrap:wrap;gap:12px;">
        <a class="btn btn-commit" href="/course">Enter Unlocked Course Portal</a>
        <a class="btn" href="/dashboard">View Receipt &amp; Upgrades</a>
      </div>
    </section>
  </main>

  <script type="module">
    const qs = new URLSearchParams(location.search);
    let ref = qs.get('ref') || '';
    const paymentId = qs.get('payment') || qs.get('payment_id') || '';
    const sessionId = qs.get('session') || qs.get('session_id') || '';
    const tier = qs.get('tier') || 'starter-pass';

    const badge = document.getElementById('suc-badge');
    const title = document.getElementById('suc-title');
    const copy = document.getElementById('suc-copy');
    const meta = document.getElementById('suc-meta');
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

    function renderOrder(o) {
      badge.textContent = `ORDER ${o.order_ref} // ${String(o.status).toUpperCase()}`;
      if (o.status === 'paid') {
        title.textContent = `Level ${o.tier_level} Modules Unlocked`;
        copy.textContent = `Your seat for ${o.package_name} is confirmed in Firebase Firestore and ready immediately.`;
      } else {
        title.textContent = `Order Status: ${String(o.status).toUpperCase()}`;
        copy.textContent = `Order is currently ${o.status}. Webhook confirmation will unlock access automatically once Whop settles.`;
      }
      meta.innerHTML = `
        <div><dt class="mono" style="font-size:11px;color:var(--muted);">PACKAGE</dt><dd style="margin:4px 0 0;font-weight:600;">${esc(o.package_name)}</dd></div>
        <div><dt class="mono" style="font-size:11px;color:var(--muted);">NET CHARGED</dt><dd class="num" style="margin:4px 0 0;">$${(o.final_cents / 100).toFixed(2)}</dd></div>
        <div><dt class="mono" style="font-size:11px;color:var(--muted);">CHECKOUT</dt><dd class="mono" style="margin:4px 0 0;">${esc(o.provider)}</dd></div>
      `;
    }

    async function load(attempt = 0) {
      if (attempt === 0 && (paymentId || ref)) {
        try {
          const completeRes = await fetch('/api/v1/checkout/whop/complete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ orderRef: ref, paymentId, sessionId, packageSlug: tier }),
          });
          if (completeRes.ok) {
            const completeData = await completeRes.json();
            if (completeData.order?.order_ref) ref = completeData.order.order_ref;
            if (completeData.status === 'paid' && completeData.order) {
              const statusRes = await fetch(`/api/v1/checkout/orders/${encodeURIComponent(ref || paymentId)}/status`);
              if (statusRes.ok) {
                const statusData = await statusRes.json();
                renderOrder(statusData.order);
                return;
              }
            }
          }
        } catch {
          // Fall back to direct order lookup below
        }
      }

      const lookupKey = ref || paymentId;
      if (!lookupKey) {
        badge.textContent = 'WHOP CHECKOUT // READY';
        title.textContent = 'Checkout Received';
        copy.textContent = 'Check your /dashboard or open /course once your Whop webhook confirms enrollment.';
        return;
      }

      const res = await fetch(`/api/v1/checkout/orders/${encodeURIComponent(lookupKey)}/status`);
      const data = await res.json();
      if (!res.ok) {
        if (attempt < 4) {
          copy.textContent = 'Waiting briefly for Whop confirmation webhook...';
          setTimeout(() => load(attempt + 1), 1500);
          return;
        }
        badge.textContent = 'ORDER PENDING';
        title.textContent = 'Awaiting Whop Confirmation';
        copy.textContent = data.error || 'No local receipt matched yet. Once Whop delivers the webhook, your access activates in /course.';
        return;
      }

      renderOrder(data.order);
      if (data.order.status === 'pending' && attempt < 4) {
        setTimeout(() => load(attempt + 1), 1500);
      }
    }
    load();
  </script>
</body>
</html>
