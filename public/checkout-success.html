<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seat Confirmed &amp; Unlocked — VERNIER</title>
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
  <link rel="stylesheet" href="/styles/tokens.css">
  <link rel="stylesheet" href="/styles/site.css">
</head>
<body>
  <header class="site-header" aria-label="Primary navigation">
    <a class="brand-lockup" href="/"><img src="/assets/logo.svg" alt="" width="24" height="24"><span>VERNIER</span></a>
    <nav class="nav-links"><a href="/dashboard">Dashboard</a><a href="/course" class="nav-cta">Open Course Portal</a></nav>
  </header>

  <main style="min-height:100vh;padding:96px clamp(20px,5vw,72px) 72px;display:grid;place-items:center;">
    <section class="spec-card featured" style="width:min(640px,100%);">
      <div class="spec-label"><span class="dot"></span><span id="suc-badge">SETTLEMENT STATUS // VERIFYING</span></div>
      <h1 id="suc-title" class="display-lg" style="font-size:2.1rem;margin:10px 0 8px;">Order Settled &amp; Entitlement Active</h1>
      <p id="suc-copy" style="margin:0;color:var(--muted);">Loading order ledger record...</p>

      <dl id="suc-meta" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin:22px 0;padding:16px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);"></dl>

      <div style="display:flex;flex-wrap:wrap;gap:12px;">
        <a class="btn btn-commit" href="/course">Enter Unlocked Course Portal</a>
        <a class="btn" href="/dashboard">View Receipt &amp; Upgrades</a>
      </div>
    </section>
  </main>

  <script type="module">
    const ref = new URLSearchParams(location.search).get('ref') || '';
    const badge = document.getElementById('suc-badge');
    const title = document.getElementById('suc-title');
    const copy = document.getElementById('suc-copy');
    const meta = document.getElementById('suc-meta');
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

    async function load() {
      if (!ref) {
        copy.textContent = 'No order reference supplied. Your active entitlements remain accessible in /course.';
        return;
      }
      const res = await fetch(`/api/v1/checkout/orders/${encodeURIComponent(ref)}/status`);
      const data = await res.json();
      if (!res.ok) {
        badge.textContent = 'ORDER NOT FOUND';
        copy.textContent = data.error || 'Unable to locate receipt.';
        return;
      }
      const o = data.order;
      badge.textContent = `ORDER ${o.order_ref} // ${String(o.status).toUpperCase()}`;
      if (o.status === 'paid') {
        title.textContent = `Level ${o.tier_level} Modules Unlocked`;
        copy.textContent = `Your seat for ${o.package_name} is confirmed in SQLite and ready immediately.`;
      } else {
        title.textContent = `Order Status: ${String(o.status).toUpperCase()}`;
        copy.textContent = `Order is currently ${o.status}. Refresh or verify in /dashboard.`;
      }
      meta.innerHTML = `
        <div><dt class="mono" style="font-size:11px;color:var(--muted);">PACKAGE</dt><dd style="margin:4px 0 0;font-weight:600;">${esc(o.package_name)}</dd></div>
        <div><dt class="mono" style="font-size:11px;color:var(--muted);">NET CHARGED</dt><dd class="num" style="margin:4px 0 0;">$${(o.final_cents / 100).toFixed(2)}</dd></div>
        <div><dt class="mono" style="font-size:11px;color:var(--muted);">RAIL</dt><dd class="mono" style="margin:4px 0 0;">${esc(o.provider)}</dd></div>
      `;
    }
    load();
  </script>
</body>
</html>
